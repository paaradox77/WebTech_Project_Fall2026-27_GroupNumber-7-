<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
</head>
<body>
    <div class="container">
        <h1>Patient Registration Form</h1>

        <form action="register.php" method="post">
            
            <!-- Section 1: Patient Personal Information -->
            <fieldset style="border-radius: 10px;">
                <legend>Patient Personal Information</legend>
                <table>
                    <!-- Patient Name -->
                    <tr>
                        <td><label for="PatientName">Patient Name:</label></td>
                        <td><input type="text" id="PatientName" name="PatientName" placeholder="Enter Your Name"></td>
                    </tr>

                    <!-- Patient Age -->
                    <tr>
                        <td><label for="PatientAge">Patient Age:</label></td>
                        <td><input type="number" id="PatientAge" name="PatientAge" placeholder="Enter your Age"></td>
                    </tr>

                    <!-- Patient Email -->
                    <tr>
                        <td><label for="PatientEmail">Patient Email:</label></td>
                        <td><input type="email" id="PatientEmail" name="PatientEmail" placeholder="Enter your Email"></td>
                    </tr>

                    <!-- Patient Gender (Radio: pick one) -->
                    <tr>
                        <td><label>Patient Gender:</label></td>
                        <td>
                            <input type="radio" id="PatientMale" name="Gender" value="Male">
                            <label for="PatientMale">Male</label>

                            <input type="radio" id="PatientFemale" name="Gender" value="Female">
                            <label for="PatientFemale">Female</label>
                        </td>
                    </tr>

                    <!-- Patient Prescription (File upload) -->
                    <tr>
                        <td><label for="Prescription">Patient Prescription:</label></td>
                        <td><input type="file" id="Prescription" name="Prescription"></td>
                    </tr>

                    <!-- Patient DOB -->
                    <tr>
                        <td><label for="DOB">Patient DOB:</label></td>
                        <td><input type="date" id="DOB" name="DOB"></td>
                    </tr>

                    <!-- Patient Address -->
                    <tr>
                        <td><label for="Address">Patient Address:</label></td>
                        <td>
                            <textarea id="Address" name="Address" rows="5" cols="20" style="resize:none" placeholder="Your Text Here"></textarea>
                        </td>
                    </tr>

                    <!-- Citizenship (Dropdown) -->
                    <tr>
                        <td><label for="country">Citizenship:</label></td>
                        <td>
                            <select id="country" name="country">
                                <option value="Default">-- Select Country --</option>
                                <option value="Bangladesh">Bangladesh</option>
                                <option value="Brazil">Brazil</option>
                            </select>
                        </td>
                    </tr>

                    <!-- Selected Doctor Dept (Checkboxes) -->
                    <tr>
                        <td><label>Selected Doctor Dept:</label></td>
                        <td>
                            <input type="checkbox" id="Medicine" name="DeptDoctor" value="Medicine">
                            <label for="Medicine">Medicine</label>

                            <input type="checkbox" id="Cardiac" name="DeptDoctor" value="Cardiac">
                            <label for="Cardiac">Cardiac</label>

                            <input type="checkbox" id="Neurology" name="DeptDoctor" value="Neurology">
                            <label for="Neurology">Neurology</label>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Section 2: User Profile -->
            <fieldset style="border-radius: 10px;">
                <legend>User Profile</legend>
                <table>
                    <!-- Username -->
                    <tr>
                        <td><label for="UserName">User Name:</label></td>
                        <td><input type="text" id="UserName" name="UserName"></td>
                    </tr>

                    <!-- Password -->
                    <tr>
                        <td><label for="Password">Password:</label></td>
                        <td><input type="password" id="Password" name="Password"></td>
                    </tr>

                    <!-- Confirm Password -->
                    <tr>
                        <td><label for="Conpassword">Confirm Password:</label></td>
                        <td><input type="password" id="Conpassword" name="Conpassword"></td>
                    </tr>
                </table>
            </fieldset>

            <!-- Terms and Conditions -->
            <br>
            <input type="checkbox" id="Condition" name="Condition">
            <label for="Condition" style="color:red">I Agree Terms and Condition *</label>
            <br><br>

            <!-- Buttons -->
            <input type="submit" id="submit" value="Signup">
            <input type="reset" id="reset" value="Reset">

        </form>
    </div>
</body>
</html>
