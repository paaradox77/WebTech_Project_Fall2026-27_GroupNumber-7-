<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Platform Staff | SkillBridge BD</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <link rel="stylesheet" href="Admin.css">
        <script src="../JS/Common.js"></script>
        <script src="JS/AdminValidation.js"></script>
        <script src="JS/AddStaff.js"></script>
    </head>

    <body class="admin">
        <img src="../Images/logo.png" id="logo" alt="SkillBridge BD logo">

        <div class="header">
            <h1>Add Platform Staff</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html">Login</a>
            <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html" class="active">Add Staff</a>
            <a href="ManageDepartment.html">Categories</a>
            <a href="GenerateReport.html">Reports</a>
        </div>

        <form onsubmit="return validateAddStaffForm()" onreset="adminClearFormErrors()" novalidate>

            <fieldset>
                <legend>Platform Team Member</legend>
                <table>
                    <tr>
                        <td><label>Team Role:</label></td>
                        <td>
                            <label class="choice"><input type="radio" name="stafftype" value="Platform Support Specialist"> Platform Support Specialist</label>
                            <label class="choice"><input type="radio" name="stafftype" value="Trust &amp; Safety Moderator"> Trust &amp; Safety Moderator</label>
                            <label class="choice"><input type="radio" name="stafftype" value="Operations Coordinator"> Operations Coordinator</label>
                            <label class="choice"><input type="radio" name="stafftype" value="Finance Assistant"> Finance Assistant</label>
                            <p class="error" id="StaffTypeError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="StaffName">Full Name:</label></td>
                        <td><input type="text" id="StaffName" placeholder="e.g. Ayesha Rahman">
                            <p class="error" id="NameError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="StaffEmail">Email:</label></td>
                        <td><input type="email" id="StaffEmail" placeholder="e.g. ayesha@skillbridge.bd">
                            <p class="error" id="EmailError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="StaffPhone">Phone:</label></td>
                        <td><input type="tel" id="StaffPhone" placeholder="e.g. 01712345678">
                            <p class="error" id="PhoneError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Employment Details</legend>
                <table>
                    <tr>
                        <td><label for="Department">Platform Team:</label></td>
                        <td>
                            <select id="Department">
                                <option value="">-- Select Team --</option>
                                <option value="Client Support">Client Support</option>
                                <option value="Trust &amp; Safety">Trust &amp; Safety</option>
                                <option value="Platform Operations">Platform Operations</option>
                                <option value="Finance">Finance</option>
                            </select>
                            <p class="hint">Choose the team that matches the selected platform role.</p>
                            <p class="error" id="DepartmentError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="EmploymentType">Employment Type:</label></td>
                        <td>
                            <select id="EmploymentType">
                                <option value="">-- Select Type --</option>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                            </select>
                            <p class="error" id="EmploymentError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="JoiningDate">Start Date:</label></td>
                        <td><input type="date" id="JoiningDate">
                            <p class="hint">Choose a date within the past 10 years or the next 30 days.</p>
                            <p class="error" id="JoiningError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Salary">Monthly Salary (BDT):</label></td>
                        <td><input type="number" id="Salary" placeholder="e.g. 30000">
                            <p class="error" id="SalaryError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Add Staff">
            <input type="reset" id="reset" value="Reset">
        </form>

        <div class="footer">
            <h5>By Jihad</h5>
        </div>
    </body>
</html>
