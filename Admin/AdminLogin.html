<!DOCTYPE html>
<html lang="en-US" >
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <script src="..JS/Common.js"></script>
        <script src="JS/AdminLogin.js"></script>

    </head>

    <body class="admin" onload="makeCaptcha()">
        <img src="../Images/logo.png" id="logo" alt="Logo">

        <div class="header">
            <h1>Admin Login</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
             <a href="AdminLogin.html" class="active">Login</a>
             <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html">Add Staff</a>
            <a href="ManageDepartment.html">Department</a>
            <a href="GenerateReport.html">Repots</a>
        </div>

        <form onsubmit="return validateAdminLogin()" onreset="clearAllErrors()" novalidate>

            <fieldset>
                <legend> Sign IN </legend>
                <table>
                    <tr>
                        <td>
                            <label for="AdminID">Admin ID:</label>
                        </td>
                        <td>
                            <input type="text" id="AdminID" placeholder="e.g. ADM-1234">
                            <p class="error" id="AdminIDError"></p>
                        </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="Password" id="Password" placeholder="Enter password">
                            </td>
                            <td>
                                    <label class="choice">
                                        <input type="checkbox" onclick="togglePassword('password', this)">
                                        Show Password
                                    </label>
                                    
                            </td>
                        </tr>
                        </tr>
                </table>

    </body>

    </html>
