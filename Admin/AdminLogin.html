<!DOCTYPE html>
<html lang="en-US" >
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login | SkillBridge BD</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <link rel="stylesheet" href="Admin.css">
        <script src="../JS/Common.js" defer></script>
        <script src="JS/AdminLogin.js" defer></script>

    </head>

    <body class="admin" onload="makeCaptcha()">
        <img src="../Images/logo.png" id="logo" alt="SkillBridge BD logo">

        <div class="header">
            <h1>SkillBridge Admin Login</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
             <a href="AdminLogin.html" class="active">Login</a>
             <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html">Add Staff</a>
             <a href="ManageDepartment.html">Categories</a>
            <a href="GenerateReport.html">Reports</a>
        </div>

        <form id="adminLoginForm" onsubmit="return validateAdminLogin()" onreset="clearLoginErrors()" novalidate>

            <fieldset>
                <legend>SkillBridge Admin Sign In</legend>
                <table>
                    <tr>
                        <td>
                            <label for="AdminID">Admin ID:</label>
                        </td>
                        <td>
                            <input type="text" id="AdminID" placeholder="e.g. ADM-1234" autocomplete="username">
                            <p class="error" id="AdminIDError"></p>
                        </td>
                        </tr>
                        
                        <tr>
                        <td><label for="Password">Password:</label></td>
                        <td><input type="password" id="Password" placeholder="Enter password" autocomplete="current-password">
                            <label class="choice"><input type="checkbox" onclick="togglePassword('Password', this)"> Show password</label>
                            <p class="error" id="PasswordError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Captcha">Security Check:</label></td>
                        <td><p id="CaptchaQuestion"></p>
                            <input type="number" id="Captcha" placeholder="Your answer" min="2" max="18" step="1">
                            <button type="button" class="small-btn" onclick="makeCaptcha()">New question</button>
                            <p class="error" id="CaptchaError"></p></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td><label class="choice"><input type="checkbox" id="Remember"> Remember me on this computer</label></td>
                    </tr>
                            
                </table>
                <p id="ResultText" role="status" aria-live="polite"></p>
                <input type="submit" id="submit" value="Login">
                <input type="reset" id="reset" value="Clear">
            </fieldset>
        </form>

    </body>

    </html>
