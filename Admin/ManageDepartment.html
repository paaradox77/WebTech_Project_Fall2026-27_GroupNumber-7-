<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Service Categories | SkillBridge BD</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <link rel="stylesheet" href="Admin.css">
        <script src="../JS/Common.js"></script>
        <script src="JS/AdminValidation.js"></script>
        <script src="JS/ManageDepartment.js"></script>
    </head>

    <body class="admin">
        <img src="../Images/logo.png" id="logo" alt="SkillBridge BD logo">

        <div class="header">
            <h1>Add / Update Service Category</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html">Login</a>
            <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html">Add Staff</a>
            <a href="ManageDepartment.html" class="active">Categories</a>
            <a href="GenerateReport.html">Reports</a>
        </div>

        <form onsubmit="return validateCategoryForm()" onreset="resetCategoryForm()" novalidate>

            <fieldset>
                <legend>Category Information</legend>
                <table>
                    <tr>
                        <td><label for="DeptCode">Category Code:</label></td>
                        <td><input type="text" id="DeptCode" placeholder="e.g. WEB-01">
                            <p class="error" id="DeptCodeError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="DeptName">Category Name:</label></td>
                        <td><input type="text" id="DeptName" placeholder="e.g. Web Development">
                            <p class="error" id="DeptNameError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="HeadName">Category Lead:</label></td>
                        <td><input type="text" id="HeadName" placeholder="e.g. Ayesha Rahman">
                            <p class="error" id="HeadError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Floor">Typical Minimum Budget (BDT):</label></td>
                        <td><input type="number" id="Floor" placeholder="e.g. 5000">
                            <p class="error" id="FloorError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Beds">Typical Maximum Budget (BDT):</label></td>
                        <td><input type="number" id="Beds" placeholder="e.g. 25000">
                            <p class="error" id="BedsError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Category Settings</legend>
                <table>
                    <tr>
                        <td><label>Category Status:</label></td>
                        <td>
                            <label class="choice"><input type="radio" name="emergency" value="Open"> Open</label>
                            <label class="choice"><input type="radio" name="emergency" value="Paused"> Paused</label>
                            <p class="error" id="EmergencyError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label>Related Skills:</label></td>
                        <td>
                            <label class="choice"><input type="checkbox" name="facility" value="Web Development"> Web Development</label>
                            <label class="choice"><input type="checkbox" name="facility" value="UI/UX Design"> UI/UX Design</label>
                            <label class="choice"><input type="checkbox" name="facility" value="Graphic Design"> Graphic Design</label>
                            <label class="choice"><input type="checkbox" name="facility" value="Digital Marketing"> Digital Marketing</label>
                            <label class="choice"><input type="checkbox" name="facility" value="Mobile App Development"> Mobile App Development</label>
                            <label class="choice"><input type="checkbox" name="facility" value="Writing &amp; Translation"> Writing &amp; Translation</label>
                            <p class="hint">Choose skills that clients can use to find freelancers in this category.</p>
                            <p class="error" id="FacilityError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="Description">Category Description:</label></td>
                        <td><textarea id="Description" placeholder="Describe the services and skills covered by this category."
                                      oninput="showCharCount(this, '#DescCount', 0, 200)"></textarea>
                            <p class="hint" id="DescCount">0 / 200 characters</p>
                            <p class="error" id="DescriptionError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Save Category">
            <input type="reset" id="reset" value="Reset">
        </form>

        <div class="footer">
            <h5>Created By Jihad</h5>
        </div>
    </body>
</html>
