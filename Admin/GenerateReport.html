<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Generate Report</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <script src="../JS/Common.js"></script>
        <script src="JS/GenerateReport.js"></script>
    </head>

    <body class="admin">
        <img src="../Images/logo.png" id="logo" alt="AIUB Logo">

        <div class="header">
            <h1>Generate Report</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html">Login</a>
            <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html">Add Staff</a>
            <a href="ManageDepartment.html">Departments</a>
            <a href="GenerateReport.html" class="active">Reports</a>
        </div>

        <form onsubmit="return validateReportForm()" onreset="clearAllErrors()" novalidate>

            <fieldset>
                <legend>Report Settings</legend>
                <table>
                    <tr>
                        <td><label for="ReportType">Report Type:</label></td>
                        <td>
                            <select id="ReportType">
                                <option value="">-- Select Report --</option>
                                <option value="Patient Admission">Patient Admission</option>
                                <option value="Billing">Billing</option>
                                <option value="Staff Attendance">Staff Attendance</option>
                                <option value="Appointments">Appointments</option>
                                <option value="Medicine Stock">Medicine Stock</option>
                            </select>
                            <p class="error" id="ReportTypeError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="FromDate">From Date:</label></td>
                        <td><input type="date" id="FromDate">
                            <p class="error" id="FromError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="ToDate">To Date:</label></td>
                        <td><input type="date" id="ToDate">
                            <p class="hint">Past dates only; one report can cover at most 366 days</p>
                            <p class="error" id="ToError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Output</legend>
                <table>
                    <tr>
                        <td><label>Include Sections:</label></td>
                        <td>
                            <label class="choice"><input type="checkbox" name="section" value="Summary"> Summary</label>
                            <label class="choice"><input type="checkbox" name="section" value="Charts"> Charts</label>
                            <label class="choice"><input type="checkbox" name="section" value="Detailed Table"> Detailed Table</label>
                            <label class="choice"><input type="checkbox" name="section" value="Comments"> Comments</label>
                            <p class="hint">Select at least 2 sections</p>
                            <p class="error" id="SectionError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label>File Format:</label></td>
                        <td>
                            <label class="choice"><input type="radio" name="format" value="PDF"> PDF</label>
                            <label class="choice"><input type="radio" name="format" value="Excel"> Excel</label>
                            <label class="choice"><input type="radio" name="format" value="CSV"> CSV</label>
                            <p class="hint">CSV files cannot hold charts</p>
                            <p class="error" id="FormatError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="SendTo">Send Report To:</label></td>
                        <td><input type="email" id="SendTo" placeholder="Enter email">
                            <p class="error" id="SendToError"></p></td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Generate">
            <input type="reset" id="reset" value="Reset">
        </form>

        <div class="footer">
            <h5>Created By Jihad</h5>
        </div>
    </body>
</html>
