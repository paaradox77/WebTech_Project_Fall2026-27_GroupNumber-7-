<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge BD - Freelancer Login</title>
    <link rel="stylesheet" href="Design/Style.css">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="topnav">
        <a href="../index.html">Home</a>
        <a href="FreelancerLogin.html" class="active">Login</a>
        <a href="FreelancerRegistration.html">Register</a>
        <a href="CreateService.html">Create Service</a>
        <a href="BrowseProjects.html">Browse Projects</a>
        <a href="SubmitProposal.html">Submit Proposal</a>
    </nav>

    <div class="container">
        <h2>Freelancer Login</h2>
        <form id="loginForm" onsubmit="return validateLogin()">
            <label for="identifier">Email or Freelancer ID:</label><br>
            <input type="text" id="identifier" name="identifier"><br>
            <span id="identifierError" style="color:red;"></span><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password">
            <input type="checkbox" id="showPass" onclick="togglePassword()"> Show Password<br>
            <span id="passwordError" style="color:red;"></span><br><br>

            <button type="submit" id="submitBtn">Login</button>
            <p id="lockoutMsg" style="color:red;"></p>
        </form>
    </div>

    <script src="JS/FreelancerLogin.js"></script>
</body>
</html>
