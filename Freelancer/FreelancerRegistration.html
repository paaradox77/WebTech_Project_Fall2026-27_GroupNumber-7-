<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge BD - Freelancer Registration</title>
    <link rel="stylesheet" href="Design/Style.css">
</head>
<body>
    <nav class="topnav">
        <a href="FreelancerLogin.html">Login</a>
        <a href="FreelancerRegistration.html" class="active">Register</a>
        <a href="CreateService.html">Create Service</a>
        <a href="BrowseProjects.html">Browse Projects</a>
        <a href="SubmitProposal.html">Submit Proposal</a>
    </nav>

    <div class="container">
        <h2>Freelancer Registration</h2>
        <form id="regForm" onsubmit="return validateRegistration()">
            <label>Full Name:</label><br>
            <input type="text" id="fullName"><br>
            <span id="nameErr" style="color:red;"></span><br><br>

            <label>Email:</label><br>
            <input type="email" id="email"><br>
            <span id="emailErr" style="color:red;"></span><br><br>

            <label>Bangladesh Phone (+880):</label><br>
            <input type="text" id="phone" placeholder="017xxxxxxxx"><br>
            <span id="phoneErr" style="color:red;"></span><br><br>

            <label>Date of Birth (18+):</label><br>
            <input type="date" id="dob"><br>
            <span id="dobErr" style="color:red;"></span><br><br>

            <label>Password:</label><br>
            <input type="password" id="regPass"><br>
            <span id="passErr" style="color:red;"></span><br><br>

            <label>Confirm Password:</label><br>
            <input type="password" id="confirmPass"><br>
            <span id="confErr" style="color:red;"></span><br><br>

            <input type="checkbox" id="terms"> I agree to the terms and conditions<br>
            <span id="termsErr" style="color:red;"></span><br><br>

            <button type="submit">Register</button>
        </form>
    </div>

    <script src="JS/FreelancerRegistration.js"></script>
</body>
</html>
