<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge BD - Create Service</title>
    <link rel="stylesheet" href="Design/Style.css">
</head>
<body>
    <nav class="topnav">
        <a href="FreelancerLogin.html">Login</a>
        <a href="FreelancerRegistration.html">Register</a>
        <a href="CreateService.html" class="active">Create Service</a>
        <a href="BrowseProjects.html">Browse Projects</a>
        <a href="SubmitProposal.html">Submit Proposal</a>
    </nav>

    <div class="container">
        <h2>Create a New Service</h2>
        <form id="serviceForm" onsubmit="return validateService()">
            <label>Service Title (10-100 characters):</label><br>
            <input type="text" id="title"><br>
            <span id="titleErr" style="color:red;"></span><br><br>

            <label>Category:</label><br>
            <select id="category">
                <option value="">Select Category</option>
                <option value="Web Development">Web Development</option>
                <option value="Design">Design</option>
            </select><br>
            <span id="catErr" style="color:red;"></span><br><br>

            <label>Description (100+ characters):</label><br>
            <textarea id="description" rows="4"></textarea><br>
            <span id="descErr" style="color:red;"></span><br><br>

            <label>Price ($ > 0):</label><br>
            <input type="number" id="price"><br>
            <span id="priceErr" style="color:red;"></span><br><br>

            <label>Delivery Time (Days):</label><br>
            <input type="number" id="deliveryTime"><br>
            <span id="timeErr" style="color:red;"></span><br><br>

            <label>Upload Image:</label><br>
            <input type="file" id="imageFile"><br>
            <span id="imgErr" style="color:red;"></span><br><br>

            <button type="submit">Publish Service</button>
        </form>
    </div>

    
    <script src="JS/CreateService.js"></script>
</body>
</html>
