<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge BD - Submit Proposal</title>
    <link rel="stylesheet" href="Design/Style.css">
</head>
<body>
    <nav class="topnav">
        <a href="FreelancerLogin.html">Login</a>
        <a href="FreelancerRegistration.html">Register</a>
        <a href="CreateService.html">Create Service</a>
        <a href="BrowseProjects.html">Browse Projects</a>
        <a href="SubmitProposal.html" class="active">Submit Proposal</a>
    </nav>

    <div class="container">
        <h2>Submit Project Proposal</h2>
        <form id="proposalForm" onsubmit="return validateProposal()">
            <label>Cover Letter (50+ characters):</label><br>
            <textarea id="coverLetter" rows="5"></textarea><br>
            <span id="coverErr" style="color:red;"></span><br><br>

            <label>Proposed Price ($):</label><br>
            <input type="number" id="proposedPrice"><br>
            <span id="priceErr" style="color:red;"></span><br><br>

            <label>Delivery Days (1 - 90):</label><br>
            <input type="number" id="deliveryDays"><br>
            <span id="daysErr" style="color:red;"></span><br><br>

            <label>Portfolio URL:</label><br>
            <input type="url" id="portfolioUrl"><br>
            <span id="urlErr" style="color:red;"></span><br><br>

            <button type="submit">Submit Proposal</button>
        </form>
    </div>

    <script src="JS/SubmitProposal.js"></script>
</body>
</html>
